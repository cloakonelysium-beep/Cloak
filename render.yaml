# Cloak v2 testnet keeper on Render's free plan (Blueprint: New > Blueprint, this repo). The testnet site is on Vercel at testnet.oncloak.xyz; the keeper keeps its onrender.com address.
# Testnet values from deployments/elysium-testnet-gloam.json and elysium-testnet-v2-factory.json (redeployed Nov 12, docs/TESTNET-REDEPLOY.md). For mainnet, swap in the mainnet addresses and blocks.
# Free plan notes (docs/OPTIMIZATION.md):
#   - Render stops a free service after 15 minutes with no incoming request. The keeper requests its own address
#     (RENDER_EXTERNAL_URL, set by Render) every 10 minutes only while it has work pending, so it sleeps when idle and
#     the site's first request wakes it (about a minute).
#   - Memory is lost when it sleeps or redeploys: queued withdrawal pieces are handed back by the site.
services:
  - type: web
    name: cloak-testnet-keeper
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cloakely/sdk build
    startCommand: node services/keeper/index.mjs
    healthCheckPath: /health
    # rebuild only when something the keeper runs changes (site, docs, contracts and e2e pushes skip the deploy)
    buildFilter:
      paths:
        - services/keeper/**
        - packages/sdk/**
        - deployments/**
        - pnpm-lock.yaml
        - package.json
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the keeper and relayer key: set in Render's dashboard, never in the repo
      - key: KEEPER_PK
        sync: false
      # Cloak v2's own launch factory (launches, reveals, settles) and the block it was made at
      - key: FACTORY
        value: "0xb9060dc9c5dcd49d424b0257b3a8b1a2939271d7"
      - key: START_BLOCK
        value: "27930789"
      # backup RPCs, comma-separated (for example a QuickNode Elysium endpoint; it carries a key, so set it in the dashboard)
      - key: RPC_BACKUP
        sync: false
      - key: CORS_ORIGINS
        value: "https://testnet.oncloak.xyz,http://localhost:5173"
      # one proxy (Render's) in front: the client IP for rate limits comes from it (review O-03)
      # NFT drops: v2's own drop contracts (since Nov 12; nothing shared with Cloak v1). "0" turns them off
      - key: DROPS
        value: "1"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Gloam's vault (Cloak's stand-in on testnet, Gloam's mainnet code, since Nov 13) and Cloak's launch vault
      - key: GLOAM_VAULT
        value: "0x3ABB2f659c1d203E18C8E8FeEf914D0DAc946370"
      - key: GLOAM_VAULT_BLOCK
        value: "28255692"
      - key: GLOAM_LAUNCH_VAULT
        value: "0xe3847f0140bdc06629b2b30a770f393e080f30b2"
      - key: GLOAM_LAUNCH_VAULT_BLOCK
        value: "28256098"
      # Cloak's ecosystem vault (outside tokens), for the public leaf list
      - key: GLOAM_ECOSYSTEM_VAULT
        value: "0x95d9073ec1840dabe4de4b9cbebdfe6bdc86706f"
      - key: GLOAM_ECOSYSTEM_VAULT_BLOCK
        value: "28256098"
      - key: GLOAM_MEMO
        value: "0x0ffd9BC4767b5082409615e842CD7F0adC570B44"
      # Cloak's escrows the relay sends for: launch swap v4, router v4, batcher v4, bids, receive, funds gate (graduation removed for the beta)
      - key: GLOAM_ESCROWS
        value: "0xa022edbe332f433ab8bc081b228c8a1d9bad98b6,0x6f67078181752ed9f312d51e2fd7f787564a86bf,0xc2c642bfbd0ad192df272c7e7486696de2355e1f,0x83430908906887d4b9ec920b0a90193b479b15f6,0x88eb84e9d8f2e59a73c41b198d32eeac84c5c7e4,0xccbd5f8fe8b3a796f2eaedc010189349e61278f6"
      - key: GLOAM_BATCHER_V4
        value: "0xc2c642bfbd0ad192df272c7e7486696de2355e1f"
      - key: GLOAM_BATCHER_V4_BLOCK
        value: "28256098"
      - key: GLOAM_FUNDS_GATE
        value: "0xccbd5f8fe8b3a796f2eaedc010189349e61278f6"
